<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>xiaobucubic</title>
<body style="font:16px system-ui;max-width:640px;margin:40px auto;padding:20px;background:#070c12;color:#f0f5fc">
<h1>xiaobucubic</h1><p>抬头，看到重要的事。</p>
<p>两个视图：主页显示订阅剩余额度与天气背景；有消息时才轮播消息页，没有消息就一直保持主页。</p>
<ul><li>左右键：切换主页 / 消息页</li><li>上键：主页切换主 / 次额度窗口并刷新；消息页显示下一条</li><li>下键：暂停 / 恢复自动轮播</li><li>Home：退出</li></ul>
<p>在应用目录的 config.json 设置 api_url 和可选的 read_token。接口数据标记 demo=true 时，屏幕会明确显示“演示”。</p>
<p>1.0.0 · ClocTeck Lua + LVGL</p></body></html>
